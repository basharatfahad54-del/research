<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F3864"/>
    </marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7F7F7F"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #1F3864; }
      .panel { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; fill: #404040; }
      .box { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #111111; }
      .boxb { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #404040; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #595959; }
      .rel { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #1F3864; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>
  <text x="700" y="36" text-anchor="middle" class="title">Figure 4.1: The SETILL conceptual framework</text>
  <text x="700" y="58" text-anchor="middle" class="small">Rectangles are constructs; arrows are proposed relationships (R1-R8), not confirmed causal paths.</text>

  <!-- Case boundary -->
  <rect x="28" y="88" width="1344" height="648" fill="none" stroke="#7F7F7F" stroke-width="2" stroke-dasharray="10 7" rx="14"/>
  <text x="46" y="110" class="note">Provisional case boundary (examined under LL1: boundary critique)</text>

  <!-- Panel labels -->
  <text x="220" y="146" text-anchor="middle" class="panel">CONTEXT</text>
  <text x="700" y="146" text-anchor="middle" class="panel">INTERVENTION</text>
  <text x="1180" y="146" text-anchor="middle" class="panel">OUTCOMES</text>

  <!-- Context boxes -->
  <rect x="80" y="180" width="280" height="110" rx="10" fill="#DEEAF6" stroke="#1F3864" stroke-width="2"/>
  <text x="220" y="212" text-anchor="middle" class="boxb">C1 Configuration</text>
  <text x="220" y="234" text-anchor="middle" class="box">Dwelling, fuel, appliance, water,</text>
  <text x="220" y="252" text-anchor="middle" class="box">space, tenure, infrastructure,</text>
  <text x="220" y="270" text-anchor="middle" class="box">institutions, practice</text>

  <rect x="80" y="330" width="280" height="96" rx="10" fill="#DEEAF6" stroke="#1F3864" stroke-width="2"/>
  <text x="220" y="360" text-anchor="middle" class="boxb">C7 Energy poverty</text>
  <text x="220" y="382" text-anchor="middle" class="box">Income, tariff, dwelling and</text>
  <text x="220" y="400" text-anchor="middle" class="box">infrastructure interacting</text>

  <rect x="80" y="466" width="280" height="96" rx="10" fill="#DEEAF6" stroke="#1F3864" stroke-width="2"/>
  <text x="220" y="496" text-anchor="middle" class="boxb">C6 Energy security</text>
  <text x="220" y="518" text-anchor="middle" class="box">Reliable availability of</text>
  <text x="220" y="536" text-anchor="middle" class="box">sufficient energy services</text>

  <!-- Centre boxes -->
  <rect x="540" y="330" width="320" height="110" rx="10" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="700" y="362" text-anchor="middle" class="boxb">C8 Living Lab apparatus</text>
  <text x="700" y="384" text-anchor="middle" class="box">Real-world setting, multi-stakeholder</text>
  <text x="700" y="402" text-anchor="middle" class="box">co-creation, iteration, experimentation</text>

  <rect x="540" y="480" width="320" height="96" rx="10" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="700" y="510" text-anchor="middle" class="boxb">C3 Participation</text>
  <text x="700" y="532" text-anchor="middle" class="box">Decision-making, co-design, co-creation,</text>
  <text x="700" y="550" text-anchor="middle" class="box">co-research, prototyping, testing</text>

  <rect x="540" y="180" width="320" height="96" rx="10" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="700" y="210" text-anchor="middle" class="boxb">C2 End-user agency</text>
  <text x="700" y="232" text-anchor="middle" class="box">Distributed capacity to act, choose,</text>
  <text x="700" y="250" text-anchor="middle" class="box">refuse and contribute</text>

  <!-- Reflexivity -->
  <rect x="560" y="612" width="280" height="66" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="700" y="638" text-anchor="middle" class="boxb">C9 Reflexivity</text>
  <text x="700" y="660" text-anchor="middle" class="box">Examining the Lab's own agential cuts</text>

  <!-- Outcome boxes -->
  <rect x="1040" y="180" width="280" height="96" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="1180" y="210" text-anchor="middle" class="boxb">C4 Acceptance</text>
  <text x="1180" y="232" text-anchor="middle" class="box">Emergent, provisional and contested</text>
  <text x="1180" y="250" text-anchor="middle" class="box">stabilisation of a technology in use</text>

  <rect x="1040" y="330" width="280" height="96" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="1180" y="360" text-anchor="middle" class="boxb">C5 Energy justice</text>
  <text x="1180" y="382" text-anchor="middle" class="box">Distribution, procedure, recognition,</text>
  <text x="1180" y="400" text-anchor="middle" class="box">extended to material relations</text>

  <rect x="1040" y="466" width="280" height="106" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1180" y="498" text-anchor="middle" class="boxb">C10 Just transition outcome</text>
  <text x="1180" y="520" text-anchor="middle" class="box">Shift from potestas toward potentia</text>
  <text x="1180" y="538" text-anchor="middle" class="box">without shifting costs onto those</text>
  <text x="1180" y="556" text-anchor="middle" class="box">least able to bear them</text>

  <!-- Context -> Centre arrows (R8) -->
  <line x1="360" y1="235" x2="540" y2="228" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="220" text-anchor="middle" class="rel">R8</text>
  <line x1="360" y1="378" x2="540" y2="390" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="370" text-anchor="middle" class="rel">R8</text>
  <line x1="360" y1="514" x2="540" y2="520" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="506" text-anchor="middle" class="rel">R8</text>

  <!-- Centre internal arrows -->
  <line x1="700" y1="276" x2="700" y2="330" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="308" class="rel">R4</text>
  <line x1="700" y1="440" x2="700" y2="480" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="466" class="rel">R1</text>

  <!-- Centre -> Outcomes -->
  <line x1="860" y1="385" x2="1040" y2="228" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="300" text-anchor="middle" class="rel">R1</text>
  <line x1="860" y1="410" x2="1040" y2="378" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="385" text-anchor="middle" class="rel">R3</text>
  <line x1="860" y1="528" x2="1040" y2="518" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="512" text-anchor="middle" class="rel">R2</text>

  <!-- Outcome internal arrows -->
  <line x1="1180" y1="276" x2="1180" y2="330" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1192" y="308" class="rel">R3</text>
  <line x1="1180" y1="426" x2="1180" y2="466" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1192" y="452" class="rel">R7</text>

  <!-- Reflexivity arrows -->
  <line x1="620" y1="612" x2="600" y2="576" stroke="#548235" stroke-width="2" marker-end="url(#dasharrow)"/>
  <line x1="780" y1="612" x2="800" y2="576" stroke="#548235" stroke-width="2" marker-end="url(#dasharrow)"/>
  <text x="560" y="596" class="rel">R5</text>

  <!-- Legend -->
  <rect x="80" y="700" width="18" height="12" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.5"/>
  <text x="106" y="711" class="note">Context construct</text>
  <rect x="220" y="700" width="18" height="12" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.5"/>
  <text x="246" y="711" class="note">Intervention construct</text>
  <rect x="380" y="700" width="18" height="12" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
  <text x="406" y="711" class="note">Outcome construct</text>
  <rect x="540" y="700" width="18" height="12" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="566" y="711" class="note">Proposed (researcher) construct</text>
  <rect x="780" y="700" width="18" height="12" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="806" y="711" class="note">Cross-cutting practice</text>

  <text x="700" y="790" text-anchor="middle" class="note">Source: researcher's construction, derived from Chapter 3. Figure is editable (SVG).</text>
</svg>
